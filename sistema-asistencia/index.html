<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Asistencia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sistema de Control de Asistencia</h1>
            <p class="subtitle">Registro seguro con geolocalización y fotografía</p>
        </div>
        <div class="empresas-section">
            <h2>Seleccione su empresa:</h2>
            <div class="empresas-grid" id="empresasGrid">
                <!-- Las empresas se cargarán dinámicamente aquí -->
                <div class="loading">Cargando empresas...</div>
            </div>
        </div>
        <div class="admin-section">
            <button class="admin-btn" onclick="irAdministrador()">ACCESO ADMINISTRADOR</button>
        </div>
        <footer class="footer">
            <p>© 2025 Sistema de Asistencia - Versión 2.0</p>
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
