<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="../../css/panelAdmin/admin-panel.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-panel-container">
        <!-- Header -->
        <div class="admin-header">
            <h1><i class="fas fa-tachometer-alt"></i> PANEL DE ADMINISTRACIÓN</h1>
            <p class="welcome-text">Bienvenido: <strong id="adminName">Administrador</strong></p>
        </div>

        <!-- Botones de acción -->
        <div class="admin-actions">
            <button class="admin-btn btn-employees" onclick="verListaEmpleados()">
                <i class="fas fa-users"></i> VER LISTA DE EMPLEADOS
            </button>
            
            <button class="admin-btn btn-reports" onclick="verReporteAsistencias()">
                <i class="fas fa-chart-bar"></i> VER REPORTE DE ASISTENCIAS
            </button>
            
            <button class="admin-btn btn-export" onclick="exportarDatos()">
                <i class="fas fa-file-export"></i> EXPORTAR A EXCEL/PDF
            </button>
        </div>

        <!-- Conexión con Excel Sheets -->
        <div class="excel-connection">
            <h3><i class="fas fa-table"></i> CONEXIÓN EXCEL SHEETS</h3>
            <div class="connection-controls">
                <input type="text" id="sheetsUrl" placeholder="URL de Excel Sheets" class="url-input">
                <div class="connection-buttons">
                    <button class="btn-connect" onclick="conectarSheets()">
                        <i class="fas fa-link"></i> CONECTAR
                    </button>
                    <button class="btn-refresh" onclick="actualizarDatos()">
                        <i class="fas fa-sync"></i> ACTUALIZAR
                    </button>
                </div>
                <div class="connection-status">
                    Estado: <span id="connectionStatus" class="status-disconnected">Desconectado</span>
                </div>
            </div>
        </div>

        <!-- Tabla de resumen -->
        <div class="summary-section">
            <h3><i class="fas fa-table"></i> TABLA RESUMEN - <span id="currentMonth"></span></h3>
            <div class="table-responsive">
                <table class="summary-table">
                    <thead>
                        <tr>
                            <th>Empleado</th>
                            <th>Empresa</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Estado</th>
                            <th>Horas</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody">
                        <!-- Los datos se cargarán dinámicamente -->
                    </tbody>
                </table>
            </div>
            <div class="table-footer">
                <div class="total-hours">
                    TOTAL MES: <span id="currentMonthYear"></span> | 
                    HORAS TRABAJADAS: <span id="totalHours">0:00</span> horas
                </div>
            </div>
        </div>

        <!-- Botones de navegación -->
        <div class="navigation-buttons">
            <button class="nav-btn btn-back" onclick="volver()">
                <i class="fas fa-arrow-left"></i> VOLVER
            </button>
            <button class="nav-btn btn-logout" onclick="cerrarSesion()">
                <i class="fas fa-sign-out-alt"></i> CERRAR SESIÓN
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/panelAdmin/admin-panel.js"></script>
</body>
</html>
